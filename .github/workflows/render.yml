name: render film
on:
  workflow_dispatch:
  push:
    paths: ['render_chunked.mjs', 'rome/a*', 'rome/basemap.mini.json']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: skills/city-through-time/package-lock.json }
      - name: deps + chromium
        run: |
          cd skills/city-through-time
          npm ci
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: render film
        run: |
          CHROME=$(ls "$HOME/.cache/ms-playwright/"chromium-*/chrome-linux/chrome | head -1)
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          node render_chunked.mjs rome
      - uses: actions/upload-artifact@v4
        with:
          name: film
          path: rome/film.mp4
