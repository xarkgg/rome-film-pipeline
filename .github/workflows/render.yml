name: render film
on:
  workflow_dispatch:
  push:
    paths: ['render_chunked.mjs', 'skills/**', 'rome/a*', 'rome/basemap.mini.json']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: skills/city-through-time/package-lock.json }
      - name: deps + chromium
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd skills/city-through-time
          npm ci
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: render film
        run: |
          export CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -not -path "*headless*" | head -1)
          [ -z "$CHROME" ] && { echo "NO CHROME"; ls -R "$HOME/.cache/ms-playwright"; exit 1; }
          node render_chunked.mjs rome
      - uses: actions/upload-artifact@v4
        with:
          name: film
          path: rome/film.mp4
